<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>
<body>
    <header>
        <h1>Gerenciador de Tarefas</h1>
        <button class="categoriaCriar">Criar Categoria</button>
        <a href="#concluido" class="categoriaCriar">Ir para concluídos</a>
    </header>
    <form id="todas">
        <div class="bloco-tarefas">
            <h2>Pendente</h2>
            <section id="pendente" class="secao">
                <button type="submit" id="pesquisar"><img src="img/icones/search_24dp_1F1F1F_FILL0_wght400_GRAD0_opsz24.png" alt="Lupinha do pesquisar"></button>
                <button type="submit" id="criarTarefa">+</button>
            </section>
        </div>
        <div class="bloco-tarefas">
            <h2>Concluído</h2>
            <section id="concluido" class="secao">
            </section>
        </div>
    </form>
</body>
</html>
