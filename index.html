<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>
<body>
    <header>
        <h1>Gerenciador de Tarefas</h1>
        <button class="categoriaCriar">Criar Categoria</button>
    </header>
    <form id="todas">
        <div>
            <h2>Pendente</h2>
            <section id="pendente" class="secao">
                <h3 class="default">Adicione uma tarefa!</h3>
                <button type="submit" id="criarTarefa">+</button>
            </section>
        </div>
        <div>
            <h2>Concluído</h2>
            <section id="concluido" class="secao">
        </div>
        </section>
    </form>
</body>
</html>
